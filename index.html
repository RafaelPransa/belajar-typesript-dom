<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar TypeScirpt + DOM</title>
</head>

<body>
    <h1 id="judul">Belajar TypeScript DOM</h1>
    <input type="text" id="nama" placeholder="Masukkan nama">
    <button id="btn">Tampilkan</button>
    <p id="hasil"></p>

    <button id="reset">Reset</button>

    <!-- Tahap 15 DOM & Form Handling -->
    <form id="loginForm">
        <h2>Login Akademik</h2>

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="contoh@email.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Minimal 8 karakter" required>

        <button type="submit" id="loginButton">
            Login
        </button>

        <p id="error"></p>
        <p id="success"></p>
    </form>
</body>

<script src="./dist/index.js" type="module"></script>

</html>
